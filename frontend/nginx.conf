server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API requests if needed, but in this setup 
    # Frontend talks to Backend URL directly usually via ENV.
    # We'll stick to basic SPA serving.
}
