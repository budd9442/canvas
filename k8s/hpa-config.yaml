apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paint-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paint-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75 
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2            
        periodSeconds: 5   
    scaleDown:
      stabilizationWindowSeconds: 30 
      policies:
      - type: Pods
        value: 1              
        periodSeconds: 5