apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paint-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERT_ARN}" 
    # Uncomment and replace the certificate-arn above once your ACM certificate is issued
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paint-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: paint-backend
            port:
              number: 3000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: paint-backend
            port:
              number: 3000
