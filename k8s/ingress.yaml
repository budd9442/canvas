apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paint-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paint-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: paint-backend
            port:
              number: 3000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: paint-backend
            port:
              number: 3000
